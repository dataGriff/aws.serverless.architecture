version: "3"
includes:
  a: { taskfile: spikes/A-catalog-source-of-truth/Taskfile.yml, dir: spikes/A-catalog-source-of-truth, optional: true }   # the spikes are evidence; an adopter may remove them
  b: { taskfile: spikes/B-localstack-buses-end-to-end/Taskfile.yml, dir: spikes/B-localstack-buses-end-to-end, optional: true }   # the spikes are evidence; an adopter may remove them
  c: { taskfile: spikes/C-join/Taskfile.yml, dir: spikes/C-join, optional: true }   # the spikes are evidence; an adopter may remove them
  d: { taskfile: spikes/D-custom-event-bus/Taskfile.yml, dir: spikes/D-custom-event-bus, optional: true }   # the spikes are evidence; an adopter may remove them
  platform: { taskfile: platform/Taskfile.yml, dir: platform }
tasks:
  default: { cmds: [task --list-all] }
  doctor:
    desc: Check the toolchain before starting
    cmds:
      - mise current
      - docker info >/dev/null 2>&1 && echo "docker ok" || echo "docker NOT running"
      - node --version && uv --version && terraform version | head -1 && aws --version
  prompts:
    desc: Install docs/architecture/prompts/*.md as the /arch:* commands and the arch-* skills (the prompt file is the source)
    cmds:
      - python3 docs/architecture/prompts/install-commands.py
  localise:report:
    desc: Show every parameter in platform.yaml, its state and where its placeholder still occurs
    cmds:
      - uv run scripts/localise_check.py --report
  localise:check:
    desc: Fail until every parameter in platform.yaml is localised and no placeholder is left (prompt 00's exit gate)
    cmds:
      - uv run scripts/localise_check.py
  adr:build:
    desc: Render the decisions table in docs/architecture/decisions.md from the ADR frontmatter
    cmds:
      - uv run docs/architecture/adr/build-decisions.py
  adr:check:
    desc: Lint the ADR set (status, dates, supersedes/superseded_by, evidence) and fail if decisions.md drifted from it
    cmds:
      - uv run docs/architecture/adr/build-decisions.py --check
  prompts:check:
    desc: Lint the prompts and fail if the installed commands or skills are out of date (for CI and pre-commit)
    cmds:
      - python3 docs/architecture/prompts/install-commands.py --check
