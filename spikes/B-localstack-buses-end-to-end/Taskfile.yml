version: "3"
env:
  AWS_ENDPOINT_URL: http://localhost:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: eu-west-1
vars:
  TF_DIR: terraform/envs/local
  SPIKE_A: "{{.TASKFILE_DIR}}/../A-catalog-source-of-truth"
  # catalog-gen output the buses are built from; override to apply a different generator run
  GENERATED: '{{.GENERATED | default (printf "%s/generated/local" .SPIKE_A)}}'
  TF_VARS: -var generated_dir={{.GENERATED}} -var enable_transformer_rule={{.TRANSFORMER | default "false"}} -var enable_firehose_probe={{.FIREHOSE | default "false"}}
  PYTEST: uv run --with boto3 --with pytest --with duckdb pytest -q tests
tasks:
  default:
    cmds:
      - task --list
  up:
    desc: "Start LocalStack and wait for it (LICENSED=true → 2026.09.0 with ENFORCE_IAM, needs LOCALSTACK_AUTH_TOKEN; ENFORCE_IAM=0 to relax IAM)"
    cmds:
      - |
        if [ "{{.LICENSED}}" = "true" ]; then
          # token from the environment, else from ~/.zshrc.local (non-interactive: rc hooks cannot pollute the value; never from a file in this repo)
          export LOCALSTACK_AUTH_TOKEN="${LOCALSTACK_AUTH_TOKEN:-$(zsh -c 'source ~/.zshrc.local >/dev/null 2>&1; printf %s "$LOCALSTACK_AUTH_TOKEN"')}"
          export ENFORCE_IAM={{.ENFORCE_IAM | default "1"}}
          docker compose -f docker-compose.yml -f docker-compose.licensed.yml up -d
        else
          docker compose up -d
        fi
      - until curl -sf $AWS_ENDPOINT_URL/_localstack/health >/dev/null; do sleep 1; done; echo ready
  down:
    desc: Stop LocalStack, wipe state
    cmds:
      - docker compose down -v
      - rm -f .queues.json .dlqs.json .archive_buckets.json .generated_dir.json {{.TF_DIR}}/terraform.tfstate {{.TF_DIR}}/terraform.tfstate.backup
  deps:
    desc: Install the archive shim's validator (fastjsonschema, pure Python) where the Lambda zip picks it up
    cmds:
      - uv pip install --target terraform/modules/bus-s3-archiver/.build/deps --no-compile-bytecode fastjsonschema==2.22.2
    status:
      - test -f terraform/modules/bus-s3-archiver/.build/deps/fastjsonschema/__init__.py
  gen:
    desc: Run catalog-gen (Spike A) so generated/local is current before a plan or apply
    cmds:
      - task -d {{.SPIKE_A}} gen
  gen:check:
    desc: Fail if generated/local (or the catalog's generated files) drifted from the catalog
    cmds:
      - task -d {{.SPIKE_A}} gen:check
  init:
    dir: "{{.TF_DIR}}"
    cmds:
      - terraform init -input=false
  plan:
    desc: "Plan from the generator output (GENERATED=<dir> to plan a different run): task plan [-- -out=plan.bin]"
    dir: "{{.TF_DIR}}"
    deps: [init, deps]
    cmds:
      - terraform plan -input=false {{.TF_VARS}} {{.CLI_ARGS}}
  apply:
    desc: "Regenerate from the catalog, then apply (vars: GENERATED=<dir>, TRANSFORMER=true|false)"
    dir: "{{.TF_DIR}}"
    deps: [init, deps]
    cmds:
      - task: gen
      - terraform apply -input=false -auto-approve {{.TF_VARS}}
      - rm -f ../../../.queues.json ../../../.dlqs.json ../../../.archive_buckets.json ../../../.generated_dir.json
  test:
    desc: "Drift gate (catalog → generated → applied), then the suite. sandbox-marked tests are excluded: LocalStack gives false positives for them (ADR-025)"
    deps: [deps]
    cmds:
      - task: gen:check
      - |
        terraform -chdir={{.TF_DIR}} plan -input=false -detailed-exitcode {{.TF_VARS}} >/dev/null; rc=$?
        case $rc in
          0) ;;
          2) echo "applied buses drift from generated/ (run task apply)"; exit 1 ;;
          *) echo "terraform plan failed (exit $rc) — not drift; see the error above"; exit $rc ;;
        esac
      - "{{.PYTEST}} -m \"not transformer and not sandbox\" {{.CLI_ARGS}}"
  test-all-local:
    desc: Run every test on LocalStack including sandbox-marked ones, to see the false positives for yourself
    cmds:
      - "{{.PYTEST}} -m \"not transformer\" {{.CLI_ARGS}}"
  test-transformer:
    desc: Apply with the transformer rule and run only that test (ADR-022; the licensed image rejects the rule at apply)
    cmds:
      - task: apply
        vars: { TRANSFORMER: "true" }
      - "{{.PYTEST}} -m transformer"
  send:
    desc: "Put a sample event: task send -- events/order-placed.json"
    cmds:
      - aws events put-events --entries file://{{.CLI_ARGS}}
  dlq:
    desc: Peek at the broken-target DLQ (messages stay on the queue)
    cmds:
      - aws sqs receive-message --queue-url $(terraform -chdir={{.TF_DIR}} output -raw broken_target_dlq_url) --max-number-of-messages 10 --message-attribute-names All --visibility-timeout 0
  dlq-peek:
    desc: Every DLQ record with its ERROR_CODE / ERROR_MESSAGE
    cmds:
      - uv run --with boto3 python3 tests/dlq_peek.py
  sizes:
    desc: Pattern sizes in bytes
    dir: "{{.TF_DIR}}"
    cmds:
      - terraform output -json pattern_sizes
  rules:
    desc: Deployed rules on every bus next to the generated file each one came from
    dir: "{{.TF_DIR}}"
    cmds:
      - terraform output -json rules
  probe:
    desc: "LocalStack feature probes (archive/replay, pattern operators) — prints a table for findings.md"
    cmds:
      - uv run --with boto3 python3 tests/probe_localstack.py
  query:
    desc: "DuckDB over the bronze buckets, raw and processing-failed: task query  (or task query -- \"SELECT ... FROM archive\")"
    cmds:
      - uv run --with boto3 --with duckdb python3 tests/query_archive.py {{.CLI_ARGS}}
  probe-firehose:
    desc: "Outside Spike B's boundary: apply a Firehose stream on central (validation Lambda, dynamic partitioning, processing-failed/) and report what LocalStack honours"
    cmds:
      - task: apply
        vars: { FIREHOSE: "true" }
      - uv run --with boto3 --with duckdb python3 tests/probe_firehose.py
  depths:
    desc: Depth of every queue (probes, consumers, DLQs)
    cmds:
      - uv run --with boto3 python3 tests/queue_depths.py
  reset:
    desc: down → up → apply → test
    cmds:
      - task: down
      - task: up
      - task: apply
      - task: test
