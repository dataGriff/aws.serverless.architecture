# Spike A — what a catalog PR would run. Deliberately NOT under the repo root .github/, so it never executes here;
# every step is the same Taskfile task a developer or agent runs locally (one definition, three callers).
name: catalog-pr
on:
  pull_request:
    paths: ["spikes/A-catalog-source-of-truth/**"]
jobs:
  catalog:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: spikes/A-catalog-source-of-truth } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v2            # node 22 (EventCatalog 4.12 needs >= 22.12), uv, task
      - run: npm ci
        working-directory: spikes/A-catalog-source-of-truth/catalog
      - name: Generated output is up to date (drift fails)
        run: task gen:check
      - name: Catalog checks against main (schema diff needs the base)
        run: |
          git worktree add ../../.base origin/${{ github.base_ref }}
          task checks BASE=../../.base/spikes/A-catalog-source-of-truth/catalog
      - name: OpenAPI conventions
        run: task spectral
      - name: ODCS contracts lint
        run: task odcs:lint
      - name: Behavioural tests
        run: task test
      - name: Site builds and the build does not rewrite the catalog
        run: task catalog:build && git diff --exit-code -- catalog
