# Publishes the Spike A EventCatalog site (the worked example) to GitHub Pages, with docs/architecture/overview.html at /overview.html.
# The site also serves llms.txt, llms-full.txt and docs/llm/schemas.txt for agents (AGENTS.md, Querying the catalog).
# EventCatalog core is MIT; the static build needs no licence key. Node 22 comes from spikes/A-catalog-source-of-truth/.mise.toml.
name: pages
on:
  push:
    branches: [main]
    paths:
      - "spikes/A-catalog-source-of-truth/catalog/**"
      - "docs/architecture/overview.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: spikes/A-catalog-source-of-truth/catalog } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: spikes/A-catalog-source-of-truth/catalog/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          EVENTCATALOG_BASE: /${{ github.event.repository.name }}
      - name: The build must not rewrite the catalog
        run: git diff --exit-code -- .
      - name: Publish the one-page overview beside the catalog
        run: cp ../../../docs/architecture/overview.html dist/overview.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: spikes/A-catalog-source-of-truth/catalog/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
