# The parameters an adopting organisation replaces, in one place.
#
# `task localise:report` shows where each placeholder still occurs.
# `task localise:check`  fails while any `value` still equals its `placeholder`, and then fails if the
#                        placeholder text is still found anywhere it should have been replaced.
# Prompt 00 (/arch:day-one-decisions-and-conventions) works through this file with you and will not invent
# organisational facts: if a value is not known, it asks.
#
# Not scanned, ever: spikes' findings.md, docs/architecture/adr/ (history keeps the values it was decided
# with), tests/golden and fixtures (regenerated by the tooling), node_modules, lockfiles, this file.
# Per-parameter `exclude` adds paths for that parameter only.

version: 1

parameters:
  organisation_name:
    about: Name shown in the catalog site and its page titles.
    placeholder: "organizationName: 'Platform'"
    value: "organizationName: 'Platform'"
    used_in:
      - spikes/A-catalog-source-of-truth/catalog/eventcatalog.config.js
      - templates/catalog-repo/catalog/eventcatalog.config.js

  api_dns_suffix:
    about: Every domain's API is `{domain}.<suffix>`, delegated to the domain (ADR-005). Appears in the docs, the roadmap names, the OpenAPI `servers` and the API channel address.
    placeholder: api.example.com
    value: api.example.com
    used_in:
      - docs/architecture/README.md
      - docs/architecture/decisions.md
      - docs/architecture/roadmap.md
      - docs/architecture/prompts/14-onboard-a-new-domain.md
      - spikes/A-catalog-source-of-truth/catalog/services/order-service/openapi.yaml
      - spikes/A-catalog-source-of-truth/catalog/channels/orders-api/index.mdx
      - templates/catalog-repo/catalog/services/sample-service/openapi.yaml
      - templates/catalog-repo/catalog/channels/sample-api/index.mdx

  schema_id_base:
    about: The `$id` URL base every shared schema and event schema declares; event schemas reference shared schemas by this URL (conventions.md). It never has to resolve over the network.
    placeholder: https://platform.example
    value: https://platform.example
    used_in:
      - spikes/A-catalog-source-of-truth/catalog/schemas/**/*.json
      - spikes/A-catalog-source-of-truth/catalog/events/*/schema.json
      - templates/catalog-repo/catalog/schemas/**/*.json
      - templates/catalog-repo/catalog/events/*/schema.json

  team_email_suffix:
    about: Owner email addresses on the catalog's team pages.
    placeholder: "-team@example.com"
    value: "-team@example.com"
    used_in:
      - spikes/A-catalog-source-of-truth/catalog/teams/*.mdx
      - templates/catalog-repo/catalog/teams/*.mdx

  service_repository_base:
    about: Where a service's `repository.url` on its catalog page points.
    placeholder: https://github.com/example/
    value: https://github.com/example/
    used_in:
      - spikes/A-catalog-source-of-truth/catalog/services/*/index.mdx
      - templates/catalog-repo/catalog/services/*/index.mdx
      - templates/domain-repo/pins.yaml

  catalog_edit_url:
    about: The catalog config's `editUrl`, so "edit this page" opens your fork.
    placeholder: https://github.com/dataGriff/aws.serverless.architecture/edit/main/spikes/A-catalog-source-of-truth/catalog
    value: https://github.com/dataGriff/aws.serverless.architecture/edit/main/spikes/A-catalog-source-of-truth/catalog
    used_in:
      - spikes/A-catalog-source-of-truth/catalog/eventcatalog.config.js
      - templates/catalog-repo/catalog/eventcatalog.config.js (its own placeholder, https://github.com/example/catalog/edit/main)

  catalog_site_url:
    about: Where GitHub Pages publishes the catalog (`.github/workflows/pages.yml`); linked from the spike README.
    placeholder: https://datagriff.github.io/aws.serverless.architecture/
    value: https://datagriff.github.io/aws.serverless.architecture/
    used_in:
      - spikes/A-catalog-source-of-truth/README.md
      - README.md

  platform_region:
    about: One region for the platform and every domain account. This is a decision, not a free parameter — ADR-020 and ADR-021 chose eu-west-1 because the Custom Event Bus has no London endpoint. Change it only with a superseding ADR, then replace it here.
    placeholder: eu-west-1
    value: eu-west-1
    decided_by: [ADR-020, ADR-021]
    exclude:
      - spikes/

  # Values the docs do not carry as text, so there is nothing to grep; the check only insists they are filled in.
  identity_provider:
    about: The platform-owned JWT issuer for user-facing APIs (ADR-005) and the sign-in provider for the catalog site (`eventcatalog.auth.js` has commented examples for Entra ID, Auth0, Okta).
    required: true
    value: ""

  sandbox_account:
    about: The real AWS account the nightly L2 suite and the sandbox-only tests run in (ADR-025). An account id or alias, not credentials.
    required: true
    value: ""

  localstack_edition:
    about: "`licensed` runs L1 with `ENFORCE_IAM=1` (ADR-025, the default); `community` cannot enforce IAM and is for a look around only."
    value: licensed

# The worked example. `orders` and `payments` are used throughout docs/architecture/ and the spikes so every
# concept has a concrete name. They are not parameters to grep: replace them with your first two domains by
# running /arch:onboard-a-new-domain, not by search-and-replace.
worked_example:
  domains: [orders, payments]
  services: [order-service, payment-service]
  public_events: [OrderPlaced.v1, PaymentCaptured.v1]
  internal_events: [order.aggregate.updated.v1]
