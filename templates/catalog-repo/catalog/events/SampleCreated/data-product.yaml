# Hand-written overlay for the generated ODCS contract of SampleCreated.v1 (data-contracts.md).
# Only these keys are allowed: description, slaProperties, team, quality, terms, customProperties, tags,
# support, price, authoritativeDefinitions. Anything the generator owns (id, schema, servers, roles...) fails the build.
description:
  purpose: Analytical copy of every public SampleCreated.v1 event, one row per eventId.
  limitations: customerEmail is a ciphertext envelope inside detail; request a decryptor grant via the catalog.
  usage: Query the DuckDB view silver_sample_sample_created_v1; always filter on dt.
slaProperties:
  - property: latency
    value: 3
    unit: h
    element: sample_sample_created_v1.occurred_at
  - property: frequency
    value: 1
    unit: h
  - property: retention
    value: 2
    unit: y
team:
  - username: sample-team
    role: owner
quality:
  - type: custom
    engine: platform-checks
    implementation: reconciliation(outbox=sample, tolerance=0.001)
tags:
  - sample
