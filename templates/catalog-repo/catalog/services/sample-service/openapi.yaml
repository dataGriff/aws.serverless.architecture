openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: Design-first API of the sample domain. Every operation is a command or a query (ADR-004).
  contact:
    name: sample-team
servers:
  - url: https://sample.api.example.com
security:
  - jwt: []
tags:
  - name: samples
paths:
  /v1/samples:
    post:
      operationId: CreateSample
      summary: Create a sample
      description: Command. Idempotent on Idempotency-Key; emits SampleCreated.v1 through the outbox.
      tags: [samples]
      x-eventcatalog-message-type: command
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSampleRequest'
      responses:
        '201':
          description: Sample accepted; SampleCreated.v1 will follow on the bus.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '../../schemas/sample/Sample.json'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/samples/{id}:
    get:
      operationId: GetSample
      summary: Get a sample by id
      description: Query. Returns the current state of a sample; the one synchronous hop other domains may take into sample.
      tags: [samples]
      x-eventcatalog-message-type: query
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The sample.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '../../schemas/sample/Sample.json'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key; the same key returns the same result.
      schema:
        type: string
        maxLength: 128
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Propagated to correlationId on every event the request causes.
      schema:
        type: string
  headers:
    XCorrelationId:
      description: Echo of the request's X-Correlation-Id, or a new one.
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateSampleRequest:
      type: object
      properties:
        customerId:
          type: string
          x-pii: indirect
        customerEmail:
          type: string
          format: email
          x-pii: direct
          encryption: subject-key
          decryptors: [sample]
        total:
          $ref: '../../schemas/Money.json'
          x-pii: none
      required: [customerId, customerEmail, total]
      additionalProperties: false
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
      required: [type, title, status]
