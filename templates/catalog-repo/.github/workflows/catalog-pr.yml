# What a catalog PR runs. Every step is the same Taskfile task a developer or agent runs locally (one definition,
# three callers). In the platform repo this file is a specimen (not under the root .github/); it becomes live when
# the template is lifted into its own repository. It expects the platform tooling at ./platform (a submodule or
# vendored copy pinned to a tag) — see Taskfile.yml's PLATFORM variable.
name: catalog-pr
on:
  pull_request:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, submodules: true }
      - uses: jdx/mise-action@v2            # node 22 (EventCatalog 4.12 needs >= 22.12), uv, task
      - run: npm ci
        working-directory: catalog
      - name: Generated output is up to date (drift fails)
        run: task gen:check PLATFORM=./platform
      - name: Catalog checks against main (schema diff needs the base)
        run: |
          git worktree add ../.base origin/${{ github.base_ref }}
          task checks PLATFORM=./platform BASE=../.base/catalog
      - name: OpenAPI conventions
        run: task spectral PLATFORM=./platform
      - name: ODCS contracts lint
        run: task odcs:lint PLATFORM=./platform
      - name: Site builds and the build does not rewrite the catalog
        run: task catalog:build && git diff --exit-code -- catalog
