# The three pins every domain repo carries (ADR-014, ADR-017, ADR-025). Promotion is a PR that bumps one of them.
catalog:
  repo: https://github.com/example/catalog      # platform.yaml: service_repository_base
  tag: v0.1.0
platform:
  repo: https://github.com/example/platform
  tag: v0.1.0                                    # the generator and modules your accounts run; semver, pinned per account
localstack:
  image: localstack/localstack:2026.09.0        # licensed; Community 4.14.0 is the no-licence fallback and cannot enforce IAM
  enforce_iam: "1"
