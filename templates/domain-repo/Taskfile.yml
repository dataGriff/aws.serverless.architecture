version: "3"
env:
  AWS_ENDPOINT_URL: http://localhost:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: eu-west-1   # platform.yaml: platform_region
  PLATFORM_TF_DIR: "{{.TASKFILE_DIR}}/terraform/envs/local"
  PLATFORM_CATALOG: "{{.TASKFILE_DIR}}/.catalog/catalog"
  PLATFORM_STATE_DIR: "{{.TASKFILE_DIR}}"
vars:
  DOMAIN: sample
  # Where the platform tooling is. Lifted into its own repository: `.platform/` is a checkout of the platform repository at
  # the tag pins.yaml names (`task platform:checkout`), so the tooling is at .platform/platform. Inside the platform
  # monorepo: ../../platform. `task <x> PLATFORM=<dir>` overrides either.
  PLATFORM:
    sh: 'if [ -d "{{.TASKFILE_DIR}}/.platform/platform" ]; then echo "{{.TASKFILE_DIR}}/.platform/platform"; else echo "{{.TASKFILE_DIR}}/../../platform"; fi'
  CATALOG: '{{.CATALOG | default (printf "%s/.catalog/catalog" .TASKFILE_DIR)}}'
  TF_DIR: terraform/envs/local
  GENERATED: "{{.TASKFILE_DIR}}/generated/local"
  PYTEST: uv run --with boto3 --with pytest --with duckdb --with pyyaml --with jsonschema --with fastjsonschema pytest -q tests
tasks:
  default:
    cmds: [task --list]
  platform:checkout:
    desc: "Check out the platform repository at the tag pins.yaml names into .platform/ (REPO=… REF=… override the pins)"
    cmds:
      - |
        repo="{{.REPO}}"; ref="{{.REF}}"
        [ -n "$repo" ] || repo=$(uv run --with pyyaml python -c "import yaml;print(yaml.safe_load(open('pins.yaml'))['platform']['repo'])")
        [ -n "$ref" ]  || ref=$(uv run --with pyyaml python -c "import yaml;print(yaml.safe_load(open('pins.yaml'))['platform']['tag'])")
        rm -rf .platform && git clone --quiet "$repo" .platform && git -C .platform checkout --quiet "$ref"
        echo "platform tooling at .platform/platform ($ref)"
  catalog:checkout:
    desc: "Check out the catalog repository at the tag pins.yaml names into .catalog/ (REPO=… REF=… override the pins)"
    cmds:
      - |
        repo="{{.REPO}}"; ref="{{.REF}}"
        [ -n "$repo" ] || repo=$(uv run --with pyyaml python -c "import yaml;print(yaml.safe_load(open('pins.yaml'))['catalog']['repo'])")
        [ -n "$ref" ]  || ref=$(uv run --with pyyaml python -c "import yaml;print(yaml.safe_load(open('pins.yaml'))['catalog']['tag'])")
        rm -rf .catalog && git clone --quiet "$repo" .catalog && git -C .catalog checkout --quiet "$ref"
  up:
    desc: "Start LocalStack and wait (LICENSED=true → the pinned licensed image with ENFORCE_IAM=1; needs LOCALSTACK_AUTH_TOKEN in your shell, never in the repo)"
    cmds:
      - |
        if [ "{{.LICENSED}}" = "true" ]; then
          export ENFORCE_IAM={{.ENFORCE_IAM | default "1"}}
          docker compose -f docker-compose.yml -f docker-compose.licensed.yml up -d
        else
          docker compose up -d
        fi
      - until curl -sf $AWS_ENDPOINT_URL/_localstack/health >/dev/null; do sleep 1; done; echo ready
  down:
    cmds:
      - docker compose down -v
      - rm -f .queues.json .dlqs.json .archive_buckets.json .generated_dir.json {{.TF_DIR}}/terraform.tfstate {{.TF_DIR}}/terraform.tfstate.backup
  gen:
    desc: Generate this domain's artefacts from the pinned catalog
    cmds:
      - uv run {{.PLATFORM}}/catalog-gen/catalog_gen.py build --catalog {{.CATALOG}} --out {{.GENERATED}}
  gen:check:
    desc: Drift gate, catalog → generated
    cmds:
      - uv run {{.PLATFORM}}/catalog-gen/catalog_gen.py check --catalog {{.CATALOG}} --out {{.GENERATED}}
  init:
    dir: "{{.TF_DIR}}"
    cmds: [terraform init -input=false]
  plan:
    dir: "{{.TF_DIR}}"
    deps: [init]
    cmds: ["terraform plan -input=false -var generated_dir={{.GENERATED}} {{.CLI_ARGS}}"]
  apply:
    desc: Regenerate, then apply the domain-local env (step 1 writes terraform/envs/local)
    dir: "{{.TF_DIR}}"
    deps: [init]
    cmds:
      - task: gen
      - terraform apply -input=false -auto-approve -var generated_dir={{.GENERATED}}
      - rm -f ../../../.queues.json ../../../.dlqs.json ../../../.archive_buckets.json ../../../.generated_dir.json
  test:l0:
    desc: Contract tests, no infrastructure (every commit)
    cmds: ["{{.PYTEST}} -m l0 {{.CLI_ARGS}}"]
  test:
    desc: "Drift gates (catalog → generated → applied), then L0 and L1; sandbox-marked tests excluded (ADR-025)"
    cmds:
      - task: gen:check
      - |
        terraform -chdir={{.TF_DIR}} plan -input=false -detailed-exitcode -var generated_dir={{.GENERATED}} >/dev/null; rc=$?
        case $rc in
          0) ;;
          2) echo "applied env drifts from generated/ (run task apply)"; exit 1 ;;
          *) echo "terraform plan failed (exit $rc) — not drift"; exit $rc ;;
        esac
      - "{{.PYTEST}} -m \"not sandbox\" {{.CLI_ARGS}}"
  mock:
    desc: "Prism mock of an upstream API at the pinned catalog tag: task mock -- order-service"
    cmds:
      - npx -y @stoplight/prism-cli mock {{.CATALOG}}/services/{{.CLI_ARGS}}/openapi.yaml
  schemathesis:
    desc: Drive this domain's own API from its catalog spec through gateway validation (step 1 sets API_URL)
    cmds:
      - uvx schemathesis run {{.CATALOG}}/services/{{.DOMAIN}}-service/openapi.yaml --base-url ${API_URL:?set API_URL} --checks all
  query:
    desc: "DuckDB over this domain's bronze bucket, raw/ and processing-failed/: task query -- \"SELECT ... FROM bronze\""
    cmds:
      - uv run --with boto3 --with duckdb python -c "import sys; sys.path.insert(0, '{{.PLATFORM}}'); from platform_testing import duck; con = duck(); print(con.execute(sys.argv[1] if len(sys.argv) > 1 else 'SELECT status, reason, source, detail_type, count(*) FROM bronze GROUP BY ALL ORDER BY ALL').fetchall())" {{.CLI_ARGS}}
  reset:
    cmds:
      - task: down
      - task: up
      - task: apply
      - task: test
